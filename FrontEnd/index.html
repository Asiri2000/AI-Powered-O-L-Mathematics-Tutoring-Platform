<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI-Powered O/L Mathematics Tutoring Platform</title>

    <style>
      #google_translate_element {
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        overflow: hidden;
        visibility: hidden;
        z-index: -1;
      }
      /* Suppress Google Translate UI elements */
      body > .skiptranslate,
      .goog-te-banner-frame,
      .goog-te-gadget,
      .goog-te-balloon-frame,
      .goog-tooltip,
      .goog-tooltip:hover,
      .goog-text-highlight {
        display: none !important;
      }
      /* Prevent GT from adding top margin */
      body {
        top: 0 !important;
        position: static !important;
      }
    </style>

    <script type="text/javascript">
      /**
       * Google Translate auto-init.
       * Reads the googtrans cookie set by LanguageContext on the previous page load.
       * If no cookie exists, defaults to English (pageLanguage).
       */
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            includedLanguages: 'en,si,ta',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false,
          },
          'google_translate_element'
        );
      }
    </script>
    <script
      type="text/javascript"
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="google_translate_element"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
