<!DOCTYPE html>
<html>
<head>
<title>Chatbot</title>
<style>
    :root {
      --primary-rgb: 56, 97, 255; /* calm blue */
      --primary: rgb(var(--primary-rgb));
      --primary-contrast: #ffffff;
      --accent-rgb: 34, 197, 94; /* friendly green */
      --accent: rgb(var(--accent-rgb));
      --surface: #ffffff;
      --border: #e2e8f0; /* slate-200 */
      --text: #1f2937;   /* slate-800 */
      --muted: #64748b;  /* slate-500 */
      --bg-page: #f0f0f0;
      --bg-user-msg: #f0f0f0;
      --bg-bot-msg: #e0f0e0;
      --shadow-color: rgba(0, 0, 0, 0.1);
    }

    /* --- Dark Mode Variables --- */
    body.dark-mode {
      --primary-rgb: 96, 165, 250; /* blue-400 */
      --primary-contrast: #111827;
      --surface: #1f2937; /* gray-800 */
      --border: #4b5563; /* gray-600 */
      --text: #f9fafb;   /* gray-50 */
      --muted: #9ca3af;  /* gray-400 */
      --bg-page: #111827; /* gray-900 */
      --bg-user-msg: #374151; /* gray-700 */
      --bg-bot-msg: #164e63; /* cyan-800 */
      --shadow-color: rgba(0, 0, 0, 0.3);
    }

    html, body {
    height: 100%;
    overflow: hidden; /* Prevent page-level scrolling */
  }
  body {
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: var(--bg-page);
    /* Keep the page static, no extra height growth */
    transition: background-color 0.3s ease;
  }
  
  #chat-container {
    background-color: var(--surface);
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0px 2px 5px var(--shadow-color);
    width: 1000px;
    max-height: 90vh; /* Constrain container to viewport */
    overflow-y: auto; /* Allow container to scroll */
    display: flex;
    flex-direction: column;
    transition: background-color 0.3s ease;
  }
  
  .header-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  h1 {
    flex-grow: 1;
    text-align: center;
    margin-bottom: 0;
    color: var(--text);
  }
  
  #chat-history {
    /* Let chat history fill remaining space inside container */
    flex: 1 1 auto;
    min-height: 20vh; /* required for flex children to enable scrolling */
    overflow-y: auto;
  }
  
  .user-message {
    text-align: right;
    padding: 10px;
    background-color: var(--bg-user-msg);
    border-radius: 10px;
    margin-bottom: 5px;
    white-space: pre-wrap; /* preserve newlines */
    color: var(--text);
  }
  
  .bot-message {
    text-align: left;
    padding: 10px;
    background-color: var(--bg-bot-msg);
    border-radius: 10px;
    margin-bottom: 5px;
    white-space: pre-wrap; /* preserve newlines */
    color: var(--text);
  }
  
  form {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  
  /* Multiline message input */
  #user-input {
    flex-grow: 1;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    min-height: 96px; /* allow multiple lines */
    line-height: 1.5;
    resize: vertical; /* user can expand if needed */
    overflow-y: auto;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 16px;
    color: var(--text);
    background-color: var(--surface);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    transition: border-color .15s ease, box-shadow .15s ease, transform .05s ease;
  }
  #user-input::placeholder {
    color: var(--muted);
  }
  #user-input:focus-visible {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.15), 0 6px 12px rgba(0,0,0,0.06);
    transform: translateY(-1px);
  }
  
  button {
    background: var(--primary);
    color: var(--primary-contrast);
    border: none;
    padding: 12px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    transition: transform .05s ease, box-shadow .15s ease, background-color .15s ease;
  }
  button:hover {
    box-shadow: 0 6px 14px rgba(0,0,0,0.12);
    transform: translateY(-1px);
  }
  button:active {
    transform: translateY(0);
    box-shadow: 0 3px 8px rgba(0,0,0,0.10);
  }
  button:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.25), 0 6px 12px rgba(0,0,0,0.10);
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  #dark-mode-toggle {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.2rem;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.2s, border-color 0.2s;
    padding: 0;
  }
  #dark-mode-toggle:hover {
    background-color: rgba(127, 127, 127, 0.1);
  }

  #loader {
  display: none; /* Hide by default */
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
  </style>
</head>
<body>
  <div id="chat-container">
  <div class="header-container">
    <h1>Mathematics Tutor</h1>
    <button id="dark-mode-toggle" title="Toggle dark mode">🌙</button>
  </div>
  <div id="chat-history"></div>
  <form id="chat-form">
    <textarea id="user-input" placeholder="Ask any Mathematics Question in Sinhala or English"></textarea>
    <button type="submit">&nbsp; Ask &nbsp;</button>
  </form>
</div>
<div id="loader">
  <img src="loader.gif" width="150px" alt="Loading...">
</div>
  <!-- KaTeX CSS & JS for rendering LaTeX math (served locally) -->
  <link rel="stylesheet" href="/katex/katex.min.css">
  <script defer src="/katex/katex.min.js"></script>
  <script defer src="/katex/contrib/auto-render.min.js"></script>
  <script>
    const chatHistory = document.getElementById('chat-history');
    const userInput = document.getElementById('user-input');
    const form = document.getElementById('chat-form');
    const darkModeToggle = document.getElementById('dark-mode-toggle');

    // --- Dark Mode Logic ---
    const applyDarkMode = (isDark) => {
      if (isDark) {
        document.body.classList.add('dark-mode');
        darkModeToggle.textContent = '🔆';
      } else {
        document.body.classList.remove('dark-mode');
        darkModeToggle.textContent = '🌙';
      }
    };

    darkModeToggle.addEventListener('click', () => {
      const isDarkMode = document.body.classList.contains('dark-mode');
      applyDarkMode(!isDarkMode);
      localStorage.setItem('darkMode', !isDarkMode);
    });

    // Apply saved theme on page load
    document.addEventListener('DOMContentLoaded', () => {
      const savedMode = localStorage.getItem('darkMode') === 'true';
      applyDarkMode(savedMode);
    });
    // --- End Dark Mode Logic ---

    async function sendMessage() {
      const userMessage = userInput.value.trim();
      
      // Validate empty input
      if (!userMessage) {
        const emptyMessageResponse = "Please enter your mathematics question. I'm here and willing to help you! 😊";
        chatHistory.innerHTML += `<div class="bot-message">${emptyMessageResponse}</div>`;
        chatHistory.scrollTop = chatHistory.scrollHeight;
        return;
      }
      
      userInput.value = ''; // Clear input field
      console.log(userMessage)
      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ userInput: userMessage }),
        });

        const data = await response.json();
        console.log(data)
        const botMessage = data.response;
        console.log(botMessage)
        // Add chat messages to the chat history
        chatHistory.innerHTML += `<div class="user-message">${userMessage}</div>`;
        chatHistory.innerHTML += `<div class="bot-message">${botMessage}</div>`;

        // Render LaTeX math in the chat history
        if (typeof renderMathInElement === 'function') {
          renderMathInElement(chatHistory, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false },
            ],
            throwOnError: false,
          });
        }

        // Scroll to the bottom of the chat history
        chatHistory.scrollTop = chatHistory.scrollHeight;
      } catch (error) {
        console.error('Error:', error);
        // Handle errors gracefully, e.g., display an error message to the user
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault(); // Prevent form submission
      const loader = document.getElementById('loader');
      const userMessage = userInput.value.trim();
      
      // Only show loader if message is not empty
      if (userMessage) {
        loader.style.display = 'block'; // Show the loader
      }
      
      sendMessage().finally(() => {
        loader.style.display = 'none'; // Hide the loader after the message is sent
      });
    });
  </script>
</body>
</html>
